<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Southern Aroma - Family Accounts</title><style>body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;background:#f6f3ee;margin:0;color:#241f1b}main{max-width:720px;margin:auto;padding:24px}.card{background:white;border-radius:20px;padding:22px;margin:14px 0;box-shadow:0 3px 18px #00000012}h1{font-size:27px;margin:0 0 6px}.sub{color:#746b63}input,select,button{width:100%;box-sizing:border-box;padding:13px;margin:7px 0;border:1px solid #ddd;border-radius:12px;font-size:16px}button{background:#7b2d26;color:white;border:0;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hidden{display:none}.metric{font-size:25px;font-weight:800}.small{font-size:13px;color:#777}.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main><div class="card"><h1>Southern Aroma - Family Accounts</h1><div class="sub">Private family business tracker</div></div><section id="auth" class="card"><h2>Family Login</h2><input id="email" type="email" placeholder="Family email"><input id="password" type="password" placeholder="Password"><input id="name" placeholder="Name (new account only)"><div class="grid"><button onclick="login()">Sign in</button><button onclick="signup()">Create account</button></div><p id="msg" class="small"></p></section><section id="app" class="hidden"><div class="card"><div class="small">This month</div><div id="sales" class="metric">£0.00 sales</div><div id="profit" class="metric">£0.00 estimated profit</div><button onclick="logout()">Sign out</button></div><div class="card"><h2>Today's Sales</h2><div class="grid"><input id="date" type="date"><input id="notes" placeholder="Notes (optional)"></div><div class="grid"><input id="clover" type="number" step="0.01" placeholder="Clover"><input id="uber_eats" type="number" step="0.01" placeholder="Uber Eats"><input id="foodhub" type="number" step="0.01" placeholder="FoodHub"><input id="just_eat" type="number" step="0.01" placeholder="Just Eat"><input id="deliveroo" type="number" step="0.01" placeholder="Deliveroo"><input id="cash" type="number" step="0.01" placeholder="Cash"><input id="stripe" type="number" step="0.01" placeholder="Stripe"></div><button onclick="saveSales()">Save Today's Sales</button></div><div class="card"><h2>Add Business Expense</h2><input id="edate" type="date"><input id="edesc" placeholder="What did you buy? e.g. Chicken, rice, packaging"><div class="grid"><select id="ecat"></select><input id="eamount" type="number" step="0.01" placeholder="Amount £"></div><select id="epay"><option>Bank</option><option>Cash</option><option>Card</option><option>Other</option></select><button onclick="saveExpense()">Save Expense</button><p id="emsg" class="small"></p></div><div class="card"><h2>Monthly Summary</h2><div id="summary"></div></div></section></main><script>const SB_URL='https://hybzvzjlqtutpfdjmlrs.supabase.co';const SB_KEY='sb_publishable_M5calSkAuwig75rCOv6Btg_ksprSBBm';const sb=supabase.createClient(SB_URL,SB_KEY);const biz='71fee22f-ebe8-4fff-a49d-5ff89fe11875';const $=id=>document.getElementById(id);function today(){return new Date().toISOString().slice(0,10)}$('date').value=today();$('edate').value=today();async function signup(){const email=$('email').value.trim().toLowerCase(),password=$('password').value;if(!['southernaromauk@gmail.com','incode.com1234@gmail.com'].includes(email))return msg('Only the authorised family emails can register.');if(password.length<8)return msg('Password must be at least 8 characters.');const r=await sb.auth.signUp({email,password,options:{data:{full_name:$('name').value.trim()}}});if(r.error)return msg(r.error.message);msg('Account created. Check your email if confirmation is requested, then sign in.')}function msg(x){$('msg').textContent=x}async function login(){const r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)return msg(r.error.message);await boot()}async function logout(){await sb.auth.signOut();$('auth').classList.remove('hidden');$('app').classList.add('hidden')}async function boot(){const u=await sb.auth.getUser();const user=u.data.user;if(!user)return;const p=await sb.from('profiles').select('full_name,role,business_id').eq('id',user.id).single();if(p.error||p.data?.business_id!==biz)return msg('Your family account is not linked to Southern Aroma yet.');$('auth').classList.add('hidden');$('app').classList.remove('hidden');await loadCategories();await loadSummary()}async function loadCategories(){const r=await sb.from('expense_categories').select('id,name').eq('business_id',biz).eq('active',true).order('name');$('ecat').innerHTML=(r.data||[]).map(x=>'<option value="'+x.id+'">'+x.name+'</option>').join('')}function n(id){return Number($(id).value||0)}async function saveSales(){const u=await sb.auth.getUser();const user=u.data.user;const row={business_id:biz,sales_date:$('date').value,clover:n('clover'),uber_eats:n('uber_eats'),foodhub:n('foodhub'),just_eat:n('just_eat'),deliveroo:n('deliveroo'),cash:n('cash'),stripe:n('stripe'),notes:$('notes').value,created_by:user.id,updated_at:new Date().toISOString()};const r=await sb.from('sales_days').upsert(row,{onConflict:'business_id,sales_date'});if(r.error)return alert(r.error.message);alert('Sales saved successfully.');await loadSummary()}async function saveExpense(){const u=await sb.auth.getUser();const user=u.data.user;const row={business_id:biz,expense_date:$('edate').value,description:$('edesc').value.trim(),category_id:$('ecat').value,amount:n('eamount'),payment_method:$('epay').value,created_by:user.id};if(!row.description||!row.amount)return $('emsg').textContent='Please enter what you bought and the amount.';const r=await sb.from('expenses').insert(row);if(r.error)return $('emsg').textContent=r.error.message;$('emsg').textContent='Expense saved successfully.';$('edesc').value='';$('eamount').value='';await loadSummary()}async function loadSummary(){const d=new Date(),start=new Date(d.getFullYear(),d.getMonth(),1).toISOString().slice(0,10),end=new Date(d.getFullYear(),d.getMonth()+1,0).toISOString().slice(0,10);const s=await sb.from('sales_days').select('clover,uber_eats,foodhub,just_eat,deliveroo,cash,stripe,sales_date').eq('business_id',biz).gte('sales_date',start).lte('sales_date',end);const e=await sb.from('expenses').select('amount,expense_date,description').eq('business_id',biz).gte('expense_date',start).lte('expense_date',end);const total=(s.data||[]).reduce((a,x)=>a+['clover','uber_eats','foodhub','just_eat','deliveroo','cash','stripe'].reduce((b,k)=>b+Number(x[k]||0),0),0);const exp=(e.data||[]).reduce((a,x)=>a+Number(x.amount||0),0);$('sales').textContent='£'+total.toFixed(2)+' sales';$('profit').textContent='£'+(total-exp).toFixed(2)+' estimated profit';$('summary').innerHTML='<div class="row"><span>Sales</span><b>£'+total.toFixed(2)+'</b></div><div class="row"><span>Expenses</span><b>£'+exp.toFixed(2)+'</b></div><div class="row"><span>Estimated profit</span><b>£'+(total-exp).toFixed(2)+'</b></div><div class="small" style="margin-top:10px">Platform fees will be added in the next release.</div>'}sb.auth.getSession().then(({data})=>{if(data.session)boot()})</script></body></html>
